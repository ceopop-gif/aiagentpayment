<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AnyPay Assistant — Mobile Chat</title>
<style>
:root{--ink:#202123;--muted:#6f7379;--line:#e7e7e9;--soft:#f7f7f8;--green:#10a37f;--green2:#0b7a60;--side:#f7f7f8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{height:100dvh;display:grid;grid-template-columns:260px 1fr;overflow:hidden}.side{height:100dvh;background:var(--side);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column;z-index:60}.brand{display:flex;align-items:center;gap:10px;padding:8px}.logo{width:38px;height:38px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:#777;font-size:11px}.newchat{margin:8px 0 10px;width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:12px;background:#fff;text-align:left;font-weight:700}.nav{display:grid;gap:3px;overflow:auto}.nav button{border:0;background:transparent;padding:11px;border-radius:10px;text-align:left;color:#3f4348;line-height:1.4}.nav button:hover{background:#ececee}.sidefoot{margin-top:auto;border-top:1px solid #ddd;padding:12px 8px;color:#777;font-size:11px;line-height:1.6}
.main{height:100dvh;min-width:0;display:flex;flex-direction:column}.top{height:64px;flex:0 0 64px;border-bottom:1px solid #ededee;background:rgba(255,255,255,.96);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px;z-index:30}.top-left{display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap}.menu{display:none;border:0;background:transparent;font-size:27px;line-height:1;padding:6px}.title{font-size:17px;font-weight:800;white-space:nowrap}.online{font-size:11px;white-space:nowrap;color:#08785f}.chatbox{flex:1;min-height:0;position:relative}.scroll{height:100%;overflow:auto;padding:30px 18px calc(225px + env(safe-area-inset-bottom))}.inner{max-width:820px;margin:auto}.welcome{text-align:center;padding-top:9vh}.mark{width:56px;height:56px;border-radius:18px;margin:auto;background:var(--green);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:900}.welcome h1{font-size:30px;line-height:1.35;margin:17px 0 8px}.welcome p{max-width:620px;margin:0 auto;color:var(--muted);line-height:1.75}.suggest{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px auto 0;max-width:720px}.suggest button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px 15px;text-align:left;line-height:1.5}.suggest button:hover{background:#fafafa}
.msgs{display:grid;gap:30px}.msg{display:grid;grid-template-columns:38px minmax(0,1fr);gap:14px;align-items:start}.msg.user{grid-template-columns:minmax(0,1fr) 38px}.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:900;background:var(--green);color:#fff}.msg.user .av{grid-column:2;background:#222}.bubble{min-width:0;font-size:16px;line-height:1.8;word-break:normal;overflow-wrap:break-word}.bubble p{margin:0 0 14px}.bubble p:last-child{margin-bottom:0}.msg.user .bubble{grid-column:1;justify-self:end;max-width:82%;background:#f1f1f2;border-radius:20px;padding:12px 16px;line-height:1.65}
.card{margin-top:16px;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.035)}.cardhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-bottom:1px solid #eee}.cardhead b{font-size:16px;line-height:1.35}.cardhead small{font-size:11px;color:#777}.cardbody{padding:18px;line-height:1.65}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:var(--soft);border-radius:13px;padding:13px}.stat small{display:block;color:#777;font-size:12px}.stat b{display:block;margin-top:5px;font-size:18px;line-height:1.3}.list{display:grid}.row{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid #eee;line-height:1.45}.row:last-child{border:0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.btn{border:1px solid #ddd;background:#fff;border-radius:11px;padding:10px 14px;min-height:42px;font-size:14px;font-weight:700;line-height:1.25}.btn.primary{background:var(--green);border-color:var(--green);color:#fff}.btn.primary:hover{background:var(--green2)}.form{display:grid;gap:12px;margin-top:15px;padding:16px;border-radius:14px;background:#fafafa}.form label{font-size:13px;font-weight:700}.form input,.form select{width:100%;min-height:48px;border:1px solid #d9d9dc;border-radius:12px;background:#fff;padding:13px 14px;font-size:16px;outline:0}.hint{font-size:12px;color:#8a8d93;margin-top:12px;line-height:1.55}.qr{width:150px;height:150px;margin:16px auto;border:9px solid #fff;box-shadow:0 0 0 1px #ddd;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 50%/18px 18px}
.composerwrap{position:absolute;left:0;right:0;bottom:0;padding:18px 18px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(255,255,255,0),#fff 20%,#fff)}.composer{max-width:820px;margin:auto;border:1px solid #d9d9dc;border-radius:22px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.09);padding:9px 10px}.composer textarea{width:100%;min-height:54px;max-height:150px;border:0;outline:0;resize:none;padding:10px 7px;font-size:16px;line-height:1.55}.composefoot{display:flex;align-items:center;justify-content:space-between}.attach{border:0;background:transparent;color:#777;padding:7px 5px}.send{width:38px;height:38px;border:0;border-radius:12px;background:#222;color:#fff;font-size:18px}.note{text-align:center;font-size:10px;color:#999;line-height:1.4;margin-top:7px}.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 14px;border-radius:10px;font-size:12px;display:none;z-index:100}
@media(max-width:780px){.app{grid-template-columns:1fr}.side{position:fixed;left:-275px;width:260px;transition:.2s;box-shadow:0 16px 40px rgba(0,0,0,.16)}.side.open{left:0}.menu{display:block}.top{padding:0 12px}.top-left{gap:7px}.title{font-size:16px}.online{font-size:10px}.scroll{padding:24px 14px calc(270px + env(safe-area-inset-bottom))}.inner{max-width:100%}.welcome{padding-top:7vh}.welcome h1{font-size:26px;line-height:1.4}.welcome p{font-size:15px;line-height:1.8}.suggest{grid-template-columns:1fr}.msgs{gap:28px}.msg{grid-template-columns:36px minmax(0,1fr);gap:12px}.msg.user{grid-template-columns:minmax(0,1fr) 36px}.av{width:34px;height:34px}.bubble{font-size:16px;line-height:1.82}.msg.user .bubble{max-width:84%;padding:12px 15px}.card{margin-top:14px}.cardhead{padding:14px 15px}.cardbody{padding:15px}.grid{grid-template-columns:1fr 1fr}.actions{gap:8px}.btn{font-size:14px;padding:10px 13px}.composerwrap{padding:12px 10px calc(10px + env(safe-area-inset-bottom))}.composer{border-radius:21px}.composer textarea{min-height:50px;line-height:1.5}.row{align-items:flex-start}}
@media(max-width:390px){.title{font-size:15px}.online{font-size:9px}.scroll{padding-left:12px;padding-right:12px}.bubble{font-size:15.5px}.msg{gap:10px}.grid{grid-template-columns:1fr}.actions .btn{flex:1 1 auto}.cardhead small{font-size:9px}}
</style>
</head>
<body>
<div class="app">
<aside class="side" id="side"><div class="brand"><div class="logo">A</div><div><b>AnyPay</b><small>AI Commerce + Payment</small></div></div><button class="newchat" id="newchat">＋ แชตใหม่</button><div class="nav"><button data-menu="overview">◉ ภาพรวมธุรกิจ</button><button data-menu="stores">🏪 ร้านค้า</button><button data-menu="products">📦 สินค้า</button><button data-menu="salepage">🧾 SalePage</button><button data-menu="payment">💳 รับชำระเงิน</button><button data-menu="orders">≡ Orders</button><button data-menu="wallet">💰 การเงิน / ถอนเงิน</button><button data-menu="reports">📊 รายงาน</button><button data-menu="member">✨ สมาชิก & AI Token</button><button data-menu="settings">⚙ ตั้งค่า</button></div><div class="sidefoot">AnyPay Demo<br>ทุกอย่างทำงานในหน้า Chat</div></aside>
<main class="main"><header class="top"><div class="top-left"><button class="menu" id="menu">☰</button><div class="title">AnyPay Assistant</div></div><div class="online">● Demo Online</div></header><section class="chatbox"><div class="scroll" id="scroll"><div class="inner"><div class="welcome" id="welcome"><div class="mark">A</div><h1>วันนี้อยากให้ AnyPay ช่วยอะไร?</h1><p>ไม่ต้องเรียนรู้ Dashboard แค่บอกว่าต้องการขายอะไร รับเงินเท่าไร หรืออยากดูข้อมูลอะไร</p><div class="suggest"><button data-prompt="ขายกาแฟสุขภาพ 590 บาท ทำ SalePage ให้">ขายสินค้า + ทำ SalePage</button><button data-prompt="สร้าง QR รับเงิน 1500 บาท">สร้าง QR รับเงิน</button><button data-prompt="สรุปยอดขายวันนี้">สรุปยอดขายวันนี้</button><button data-prompt="เพิ่มสินค้าใหม่">เพิ่มสินค้าใหม่</button></div></div><div class="msgs" id="msgs"></div></div></div><div class="composerwrap"><div class="composer"><textarea id="prompt" placeholder="พิมพ์บอก AnyPay ว่าต้องการทำอะไร..."></textarea><div class="composefoot"><button class="attach" id="attach">＋ รูปสินค้า</button><button class="send" id="send">↑</button></div></div><div class="note">Demo เพื่อแสดงประสบการณ์ใช้งาน • ยังไม่ทำรายการเงินจริง</div></div></section></main>
</div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function card(title,body,tag='DEMO'){return `<div class="card"><div class="cardhead"><b>${title}</b><small>${tag}</small></div><div class="cardbody">${body}</div></div>`}
function add(role,html){$('#welcome').classList.add('hidden');const d=document.createElement('div');d.className='msg '+role;d.innerHTML=role==='user'?`<div class="bubble">${html}</div><div class="av">U</div>`:`<div class="av">A</div><div class="bubble">${html}</div>`;$('#msgs').appendChild(d);scrollBottom()}
function scrollBottom(){requestAnimationFrame(()=>{$('#scroll').scrollTop=$('#scroll').scrollHeight})}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',1700)}
const views={
overview:()=>`<p>นี่คือภาพรวมธุรกิจวันนี้ครับ</p>${card('ภาพรวมวันนี้','<div class="grid"><div class="stat"><small>ยอดขาย</small><b>฿18,950</b></div><div class="stat"><small>Orders</small><b>28</b></div><div class="stat"><small>พร้อมถอน</small><b>฿24,680</b></div></div>')}`,
stores:()=>`<p>ร้านของคุณอยู่ในบทสนทนานี้ครับ</p>${card('ร้านค้า','<div class="list"><div class="row"><span>Healthy Coffee</span><b>ACTIVE</b></div><div class="row"><span>Wellness Shop</span><b>DRAFT</b></div></div><div class="actions"><button class="btn primary" onclick="toast(\'เปิดฟอร์มสร้างร้านใน Chat (Demo)\')">＋ สร้างร้าน</button></div>')}`,
products:()=>`<p>สินค้าในร้านล่าสุดครับ</p>${card('สินค้า','<div class="list"><div class="row"><span>Healthy Coffee</span><b>฿590</b></div><div class="row"><span>Green Wellness Tea</span><b>฿390</b></div></div><div class="actions"><button class="btn primary" onclick="toast(\'เปิดฟอร์มเพิ่มสินค้าใน Chat (Demo)\')">＋ เพิ่มสินค้า</button></div>')}`,
salepage:()=>`<p>SalePage ที่พร้อมขายครับ</p>${card('SalePage','<b>Healthy Coffee</b><p>กาแฟสุขภาพสำหรับคนทำงาน • ราคา ฿590</p><div class="actions"><button class="btn primary" onclick="toast(\'สร้าง SalePage แล้ว (Demo)\')">สร้าง SalePage</button><button class="btn" onclick="sendText(\'สร้าง Payment Link สำหรับ Healthy Coffee\')">Payment Link</button></div>')}`,
payment:()=>`<p>สร้าง QR หรือ Payment Link ได้ตรงนี้เลยครับ</p>${card('รับชำระเงิน','<div class="form"><label>จำนวนเงิน</label><input id="amt" type="number" value="1500"><label>รายละเอียด</label><input id="desc" value="ค่าอบรม AI"><button class="btn primary" onclick="makeQR(this)">สร้าง QR / Payment Link</button></div><div class="hint">ระบบจริงจะเปลี่ยนเป็น PAID เมื่อได้รับการยืนยันจาก Payment Provider เท่านั้น</div>')}`,
orders:()=>`<p>Orders ล่าสุดครับ</p>${card('Orders','<div class="list"><div class="row"><span>#AP1028 • Healthy Coffee</span><b>PAID ฿1,180</b></div><div class="row"><span>#AP1027 • Wellness Set</span><b>WAITING ฿1,290</b></div></div>')}`,
wallet:()=>`<p>จัดการเงินของร้านในแชทได้เลยครับ</p>${card('การเงิน','<div class="grid"><div class="stat"><small>พร้อมถอน</small><b>฿24,680</b></div><div class="stat"><small>กำลังพัก</small><b>฿6,250</b></div><div class="stat"><small>ถอนแล้ว</small><b>฿128,900</b></div></div><div class="actions"><button class="btn primary" onclick="toast(\'เปิดฟอร์มถอนเงินใน Chat (Demo)\')">ถอนเงิน</button></div>')}`,
reports:()=>`<p>สรุป 7 วันล่าสุดครับ</p>${card('รายงาน','<div class="grid"><div class="stat"><small>ยอดขาย</small><b>฿128,450</b></div><div class="stat"><small>Orders</small><b>192</b></div><div class="stat"><small>เฉลี่ย / Order</small><b>฿669</b></div></div><div class="actions"><button class="btn primary" onclick="sendText(\'วิเคราะห์ว่าสินค้าอะไรขายดีที่สุด\')">ให้ AI วิเคราะห์</button></div>')}`,
member:()=>`<p>สถานะสมาชิกและ AI Token ของร้านครับ</p>${card('สมาชิก & AI Token','<div class="grid"><div class="stat"><small>Plan</small><b>PRO</b></div><div class="stat"><small>AI Token</small><b>68,400</b></div><div class="stat"><small>รอบบิล</small><b>28 ก.ย.</b></div></div>')}`,
settings:()=>`<p>ตั้งค่าหลักจากในแชทได้ครับ</p>${card('ตั้งค่า','<div class="row"><span>Payment สำเร็จ → Confirm Order</span><b>ON</b></div><div class="row"><span>Order ใหม่ → แจ้ง Merchant</span><b>ON</b></div><div class="actions"><button class="btn primary" onclick="toast(\'บันทึกการตั้งค่าแล้ว (Demo)\')">บันทึก</button></div>')}`};
function openView(k){const n={overview:'ภาพรวมธุรกิจ',stores:'ร้านค้า',products:'สินค้า',salepage:'SalePage',payment:'รับชำระเงิน',orders:'Orders',wallet:'การเงิน / ถอนเงิน',reports:'รายงาน',member:'สมาชิก & AI Token',settings:'ตั้งค่า'}[k]||k;add('user',esc(n));setTimeout(()=>add('ai',views[k]()),120);$('#side').classList.remove('open')}
function reply(p){const s=p.toLowerCase();if(s.includes('ร้าน'))return views.stores();if(s.includes('สินค้า'))return views.products();if(s.includes('salepage')||s.includes('หน้าขาย'))return views.salepage();if(s.includes('qr')||s.includes('รับเงิน')||s.includes('ชำระ')||s.includes('payment'))return views.payment();if(s.includes('order'))return views.orders();if(s.includes('ถอน')||s.includes('การเงิน'))return views.wallet();if(s.includes('รายงาน')||s.includes('ยอดขาย')||s.includes('วิเคราะห์'))return views.reports();if(s.includes('สมาชิก')||s.includes('token'))return views.member();if(s.includes('ตั้งค่า'))return views.settings();return `<p>รับคำสั่งแล้วครับ</p><p>ทุกขั้นตอนของ AnyPay สามารถทำต่อในบทสนทนานี้ได้ โดยไม่ต้องเปลี่ยนไปหน้า Dashboard อื่น</p><div class="actions"><button class="btn primary" onclick="sendText('สร้าง QR รับเงิน 1500 บาท')">สร้าง QR</button><button class="btn" onclick="sendText('สรุปยอดขายวันนี้')">ดูยอดขาย</button></div>`}
function sendText(v){v=(v||$('#prompt').value).trim();if(!v)return;add('user',esc(v));$('#prompt').value='';setTimeout(()=>add('ai',reply(v)),130)}
function makeQR(b){const box=b.closest('.cardbody'),a=Number(box.querySelector('#amt')?.value||1500),d=box.querySelector('#desc')?.value||'รายการรับเงิน';const out=document.createElement('div');out.innerHTML=`<div class="card"><div class="cardhead"><b>QR พร้อมรับเงิน</b><small>WAITING</small></div><div class="cardbody"><div class="qr"></div><p style="text-align:center"><b style="font-size:24px">฿${a.toLocaleString('th-TH')}</b><br><span style="color:#777">${esc(d)}</span></p><div class="actions" style="justify-content:center"><button class="btn primary" onclick="toast('คัดลอก Payment Link แล้ว (Demo)')">คัดลอกลิงก์</button></div></div></div>`;box.appendChild(out.firstElementChild);b.disabled=true;scrollBottom()}
$$('[data-menu]').forEach(b=>b.onclick=()=>openView(b.dataset.menu));$$('[data-prompt]').forEach(b=>b.onclick=()=>sendText(b.dataset.prompt));$('#send').onclick=()=>sendText();$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#newchat').onclick=()=>{$('#msgs').innerHTML='';$('#welcome').classList.remove('hidden');$('#side').classList.remove('open')};$('#attach').onclick=()=>toast('Demo: เพิ่มรูปสินค้าใน Chat');window.sendText=sendText;window.makeQR=makeQR;window.toast=toast;
</script>
</body>
</html>
