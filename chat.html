<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>AnyPay — Chat Commerce</title><style>
:root{--ink:#202123;--muted:#6b7280;--line:#e5e7eb;--side:#f7f7f8;--green:#10a37f}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,"Noto Sans Thai",system-ui,sans-serif;color:var(--ink)}button,input,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-columns:260px 1fr}.side{background:var(--side);border-right:1px solid var(--line);padding:10px;display:flex;flex-direction:column}.brand{display:flex;gap:10px;align-items:center;padding:8px}.logo{width:36px;height:36px;border-radius:11px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:900}.new{margin:8px 0 10px;width:100%;padding:11px;border:1px solid #ddd;border-radius:12px;background:#fff;text-align:left;font-weight:700}.nav{display:grid;gap:4px;overflow:auto}.nav button{border:0;background:transparent;padding:10px;border-radius:10px;text-align:left;color:#404348}.nav button:hover{background:#ececee}.foot{margin-top:auto;border-top:1px solid #ddd;padding:12px 7px;color:#666;font-size:12px}.main{min-width:0;display:flex;flex-direction:column;height:100vh}.top{height:56px;border-bottom:1px solid #eee;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.menu{display:none;border:0;background:transparent;font-size:22px}.chat{flex:1;overflow:auto;padding:28px 16px 170px}.inner{max-width:820px;margin:auto}.welcome{text-align:center;padding-top:11vh}.mark{width:54px;height:54px;border-radius:18px;background:var(--green);color:#fff;display:grid;place-items:center;margin:auto;font-size:25px;font-weight:900}.welcome h1{font-size:30px;margin:16px 0 8px}.welcome p{color:var(--muted);line-height:1.6}.suggest{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.suggest button{border:1px solid var(--line);background:#fff;border-radius:15px;padding:14px;text-align:left}.msgs{display:grid;gap:22px}.msg{display:grid;grid-template-columns:34px 1fr;gap:12px}.msg.user{grid-template-columns:1fr 34px}.msg.user .bubble{grid-column:1;justify-self:end;background:#f1f1f2;border-radius:18px;padding:11px 14px;max-width:80%}.msg.user .av{grid-column:2}.av{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:900;background:var(--green);color:#fff}.msg.user .av{background:#222}.bubble{line-height:1.55}.card{border:1px solid var(--line);border-radius:16px;margin-top:12px;overflow:hidden}.ch{padding:12px 14px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.cb{padding:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#f7f7f8;border-radius:12px;padding:11px}.stat small{color:#777;display:block}.stat b{display:block;margin-top:4px}.list{display:grid;gap:4px}.row{padding:10px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}.row:last-child{border:0}.btns{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid #ddd;background:#fff;border-radius:10px;padding:8px 11px;font-weight:700;font-size:12px}.btn.p{background:var(--green);border-color:var(--green);color:#fff}.form{display:grid;gap:9px;background:#fafafa;border-radius:12px;padding:12px;margin-top:10px}.form input{width:100%;padding:10px;border:1px solid #ddd;border-radius:10px}.qr{width:140px;height:140px;margin:12px auto;background:repeating-conic-gradient(#111 0 25%,#fff 0 50%) 50%/18px 18px;border:8px solid #fff;box-shadow:0 0 0 1px #ddd}.composerW{position:absolute;left:260px;right:0;bottom:0;padding:16px 18px 22px;background:linear-gradient(180deg,transparent,#fff 28%)}.composer{max-width:820px;margin:auto;border:1px solid #d9d9dc;border-radius:18px;background:#fff;box-shadow:0 8px 28px rgba(0,0,0,.08);padding:8px}.composer textarea{width:100%;border:0;outline:0;resize:none;min-height:44px;padding:8px}.sendrow{display:flex;justify-content:space-between;align-items:center}.send{width:36px;height:36px;border:0;border-radius:11px;background:#222;color:#fff}.note{font-size:10px;color:#999;text-align:center;margin-top:6px}.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 12px;border-radius:9px;display:none;z-index:99}
@media(max-width:780px){.app{grid-template-columns:1fr}.side{position:fixed;left:-280px;width:260px;height:100vh;z-index:50;transition:.2s}.side.open{left:0}.menu{display:block}.composerW{left:0;padding:12px 10px 16px}.chat{padding:20px 12px 165px}.suggest{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">A</div><div><b>AnyPay</b><small style="display:block;color:#777">AI Commerce + Payment</small></div></div><button class="new" id="new">＋ แชตใหม่</button><div class="nav">
<button data-m="overview">◉ ภาพรวมธุรกิจ</button><button data-m="stores">🏪 ร้านค้า</button><button data-m="products">📦 สินค้า</button><button data-m="salepage">🧾 SalePage</button><button data-m="payment">💳 รับชำระเงิน</button><button data-m="orders">≡ Orders</button><button data-m="wallet">💰 การเงิน / ถอนเงิน</button><button data-m="reports">📊 รายงาน</button><button data-m="member">✨ สมาชิก & AI Token</button><button data-m="settings">⚙ ตั้งค่า</button></div><div class="foot">AnyPay Demo • ทุกอย่างทำงานใน Chat</div></aside>
<main class="main"><header class="top"><div><button class="menu" id="menu">☰</button> <b>AnyPay Assistant</b></div><small style="color:#08785f">● Demo Online</small></header><section class="chat" id="chat"><div class="inner"><div class="welcome" id="welcome"><div class="mark">A</div><h1>วันนี้อยากให้ AnyPay ช่วยอะไร?</h1><p>ไม่ต้องเรียนรู้ Dashboard แค่บอกว่าต้องการขายอะไร รับเงินเท่าไร หรืออยากดูข้อมูลอะไร</p><div class="suggest"><button data-p="ขายกาแฟสุขภาพ 590 บาท ทำ SalePage ให้">ขายสินค้า + ทำ SalePage</button><button data-p="สร้าง QR รับเงิน 1500 บาท">สร้าง QR รับเงิน</button><button data-p="สรุปยอดขายวันนี้">สรุปยอดขายวันนี้</button><button data-p="เพิ่มสินค้าใหม่">เพิ่มสินค้าใหม่</button></div></div><div class="msgs" id="msgs"></div></div></section><div class="composerW"><div class="composer"><textarea id="prompt" placeholder="พิมพ์บอก AnyPay ว่าต้องการทำอะไร..."></textarea><div class="sendrow"><small style="color:#888">＋ รูปสินค้า</small><button class="send" id="send">↑</button></div></div><div class="note">Demo สำหรับออกแบบประสบการณ์ใช้งาน • ยังไม่ตัดเงินจริง</div></div></main></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function card(t,b){return `<div class="card"><div class="ch"><b>${t}</b><small>DEMO</small></div><div class="cb">${b}</div></div>`}function add(role,html){$('#welcome').style.display='none';let d=document.createElement('div');d.className='msg '+role;d.innerHTML=role==='user'?`<div class="bubble">${html}</div><div class="av">U</div>`:`<div class="av">A</div><div class="bubble">${html}</div>`;$('#msgs').appendChild(d);$('#chat').scrollTop=$('#chat').scrollHeight}
const views={
overview:()=>`<p>นี่คือภาพรวมธุรกิจวันนี้ครับ</p>${card('ภาพรวมวันนี้','<div class="grid"><div class="stat"><small>ยอดขาย</small><b>฿18,950</b></div><div class="stat"><small>Orders</small><b>28</b></div><div class="stat"><small>พร้อมถอน</small><b>฿24,680</b></div></div>')}`,
stores:()=>`<p>ร้านของคุณอยู่ในแชทนี้ครับ</p>${card('ร้านค้า','<div class="list"><div class="row"><span>Healthy Coffee</span><b>ACTIVE</b></div><div class="row"><span>Wellness Shop</span><b>DRAFT</b></div></div><div class="btns"><button class="btn p" onclick="formStore(this)">＋ สร้างร้าน</button></div>')}`,
products:()=>`<p>สินค้าในร้านล่าสุดครับ</p>${card('สินค้า','<div class="list"><div class="row"><span>Healthy Coffee</span><b>฿590</b></div><div class="row"><span>Green Wellness Tea</span><b>฿390</b></div></div><div class="btns"><button class="btn p" onclick="formProduct(this)">＋ เพิ่มสินค้า</button></div>')}`,
salepage:()=>`<p>SalePage ที่พร้อมขายครับ</p>${card('SalePage','<b>Healthy Coffee</b><p>กาแฟสุขภาพสำหรับคนทำงาน • ฿590</p><div class="btns"><button class="btn p" onclick="toast(\'สร้าง SalePage ใหม่แล้ว (Demo)\')">สร้าง SalePage</button><button class="btn" onclick="sendText(\'สร้าง Payment Link สำหรับ Healthy Coffee\')">Payment Link</button></div>')}`,
payment:()=>`<p>สร้าง QR หรือ Payment Link ได้ตรงนี้เลยครับ</p>${card('รับชำระเงิน','<div class="form"><input id="amt" type="number" value="1500"><input id="desc" value="ค่าอบรม AI"><button class="btn p" onclick="makeQR(this)">สร้าง QR / Payment Link</button></div>')}`,
orders:()=>`<p>Orders ล่าสุดครับ</p>${card('Orders','<div class="list"><div class="row"><span>#AP1028 • Healthy Coffee</span><b>PAID ฿1,180</b></div><div class="row"><span>#AP1027 • Wellness Set</span><b>WAITING ฿1,290</b></div></div>')}`,
wallet:()=>`<p>จัดการเงินของร้านในแชทได้เลยครับ</p>${card('การเงิน','<div class="grid"><div class="stat"><small>พร้อมถอน</small><b>฿24,680</b></div><div class="stat"><small>พักเงิน</small><b>฿6,250</b></div><div class="stat"><small>ถอนแล้ว</small><b>฿128,900</b></div></div><div class="btns"><button class="btn p" onclick="formWithdraw(this)">ถอนเงิน</button></div>')}`,
reports:()=>`<p>สรุป 7 วันล่าสุดครับ</p>${card('รายงาน','<div class="grid"><div class="stat"><small>ยอดขาย</small><b>฿128,450</b></div><div class="stat"><small>Orders</small><b>192</b></div><div class="stat"><small>เฉลี่ย/Order</small><b>฿669</b></div></div><div class="btns"><button class="btn p" onclick="sendText(\'วิเคราะห์ว่าสินค้าอะไรขายดีที่สุด\')">ให้ AI วิเคราะห์</button></div>')}`,
member:()=>`<p>สถานะสมาชิกของร้านครับ</p>${card('สมาชิก & AI Token','<div class="grid"><div class="stat"><small>Plan</small><b>PRO</b></div><div class="stat"><small>AI Token</small><b>68,400</b></div><div class="stat"><small>รอบบิล</small><b>28 ก.ย.</b></div></div>')}`,
settings:()=>`<p>ตั้งค่าระบบจากในแชทได้ครับ</p>${card('ตั้งค่า','<div class="row"><span>Payment สำเร็จ → Confirm Order</span><b>ON</b></div><div class="row"><span>Order ใหม่ → แจ้ง Merchant</span><b>ON</b></div><div class="btns"><button class="btn p" onclick="toast(\'บันทึกการตั้งค่าแล้ว\')">บันทึก</button></div>')}`};
function openView(k){let n={overview:'ภาพรวมธุรกิจ',stores:'ร้านค้า',products:'สินค้า',salepage:'SalePage',payment:'รับชำระเงิน',orders:'Orders',wallet:'การเงิน / ถอนเงิน',reports:'รายงาน',member:'สมาชิก & AI Token',settings:'ตั้งค่า'}[k];add('user',n);setTimeout(()=>add('ai',views[k]()),120);$('#side').classList.remove('open')}
function reply(p){let s=p.toLowerCase();if(s.includes('ร้าน'))return views.stores();if(s.includes('สินค้า'))return views.products();if(s.includes('salepage')||s.includes('หน้าขาย'))return views.salepage();if(s.includes('qr')||s.includes('รับเงิน')||s.includes('ชำระ')||s.includes('payment'))return views.payment();if(s.includes('order'))return views.orders();if(s.includes('ถอน')||s.includes('การเงิน'))return views.wallet();if(s.includes('รายงาน')||s.includes('ยอดขาย')||s.includes('วิเคราะห์'))return views.reports();if(s.includes('สมาชิก')||s.includes('token'))return views.member();return `<p>รับคำสั่งแล้วครับ ทุกขั้นตอนของ AnyPay สามารถทำต่อในบทสนทนานี้ได้</p><div class="btns"><button class="btn p" onclick="sendText('สร้าง QR รับเงิน 1500 บาท')">สร้าง QR</button><button class="btn" onclick="sendText('สรุปยอดขายวันนี้')">ดูยอดขาย</button></div>`}
function sendText(v){v=(v||$('#prompt').value).trim();if(!v)return;add('user',esc(v));$('#prompt').value='';setTimeout(()=>add('ai',reply(v)),120)}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',1600)}function appendForm(btn,html){let d=document.createElement('div');d.innerHTML=html;btn.closest('.cb').appendChild(d.firstElementChild);btn.disabled=true}function formStore(b){appendForm(b,'<div class="form"><input value="My New Store"><button class="btn p" onclick="this.parentElement.innerHTML=\'✓ สร้างร้านแล้ว (Demo)\'">สร้างร้าน</button></div>')}function formProduct(b){appendForm(b,'<div class="form"><input value="กาแฟสุขภาพ Premium"><input type="number" value="590"><button class="btn p" onclick="this.parentElement.innerHTML=\'✓ เพิ่มสินค้าแล้ว (Demo)\'">เพิ่มสินค้า</button></div>')}function formWithdraw(b){appendForm(b,'<div class="form"><input type="number" value="10000"><button class="btn p" onclick="this.parentElement.innerHTML=\'✓ สร้างคำขอถอนเงินแล้ว (Demo)\'">ยืนยันถอน</button></div>')}function makeQR(b){let d=document.createElement('div');d.innerHTML='<div class="qr"></div><p style="text-align:center"><b>QR พร้อมรับเงิน</b></p><div class="btns" style="justify-content:center"><button class="btn p" onclick="toast(\'คัดลอก Payment Link แล้ว\')">คัดลอกลิงก์</button></div>';b.closest('.cb').appendChild(d);b.disabled=true}
$$('[data-m]').forEach(b=>b.onclick=()=>openView(b.dataset.m));$$('[data-p]').forEach(b=>b.onclick=()=>sendText(b.dataset.p));$('#send').onclick=()=>sendText();$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendText()}};$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#new').onclick=()=>{$('#msgs').innerHTML='';$('#welcome').style.display='block';$('#side').classList.remove('open')};window.sendText=sendText;window.toast=toast;window.formStore=formStore;window.formProduct=formProduct;window.formWithdraw=formWithdraw;window.makeQR=makeQR;
</script></body></html>
