<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnyPay Commerce Manager</title><link rel="stylesheet" href="assets/styles.css"></head>
<body><div class="content" style="max-width:1100px;margin:auto;padding-top:28px"><div class="pagehead"><div><h1>AnnyPay Commerce Manager</h1><p>สร้าง SalePage และ Payment Link จาก Database จริง</p></div><a class="btn" href="index.html">← Dashboard</a></div><div id="message" class="hidden"></div>
<div class="panel card"><div class="grid2"><div class="field"><label>Merchant</label><select id="merchant"></select></div><div class="field"><label>Store</label><select id="store"></select></div></div></div>
<div class="grid2" style="margin-top:14px">
<form id="saleForm" class="panel card form-stack"><h2>สร้าง SalePage</h2><div class="field"><label>สินค้า</label><select id="product"></select></div><div class="field"><label>Headline</label><input id="headline" required></div><div class="field"><label>Slug</label><input id="saleSlug" placeholder="product-name" required></div><button class="btn primary">สร้างและ Publish</button></form>
<form id="payForm" class="panel card form-stack"><h2>สร้าง Payment Link</h2><div class="field"><label>รายละเอียด</label><input id="payDescription" required placeholder="ค่าอบรม AI"></div><div class="field"><label>จำนวนเงิน</label><input id="payAmount" type="number" min="1" step="0.01" required></div><div class="field"><label>Slug</label><input id="paySlug" required placeholder="ai-training-1500"></div><button class="btn primary">สร้าง Payment Link</button></form>
</div>
<div class="grid2" style="margin-top:14px"><div class="panel tablewrap"><table class="table"><thead><tr><th>SalePage</th><th>Status</th><th>Link</th></tr></thead><tbody id="saleBody"></tbody></table></div><div class="panel tablewrap"><table class="table"><thead><tr><th>Payment Link</th><th>ยอด</th><th>Link</th></tr></thead><tbody id="payBody"></tbody></table></div></div></div>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/commerce-admin.js"></script></body></html>
