<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AnnyPay Payment Link</title><link rel="stylesheet" href="assets/public.css"></head>
<body><div class="wrap"><div class="brand"><div class="logo">A</div><div>AnnyPay <span class="muted">Payment Link</span></div></div><div id="message" class="hidden"></div>
